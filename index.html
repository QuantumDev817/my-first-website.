<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Кенесары – Наурызбай | Комикс</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--g:#d4a24a;--r:#9b1c14;--k:#0b0706;--t:#f3d58a}
html,body{height:100%;background:#050302;color:#e3c58f;font-family:Georgia,serif;overflow:hidden}
button{font:inherit;cursor:pointer;touch-action:manipulation}
#cover,#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0)}
#cover{z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;transition:opacity 1s,transform 1s}
#cover.out{opacity:0;transform:scale(1.2);pointer-events:none}
.bg,.bg svg{position:absolute;inset:0;width:100%;height:100%}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 20%,#000e 100%)}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none;width:100%;height:100%}
.smoke{position:absolute;bottom:-20%;width:60vmax;height:60vmax;border-radius:50%;background:radial-gradient(#000a,#0000 65%);filter:blur(30px);animation:sm 14s linear infinite}
@keyframes sm{to{transform:translate(20vw,-40vh) scale(1.5);opacity:0}}
h1{position:relative;font-size:clamp(30px,8.5vw,120px);line-height:1.1;letter-spacing:.05em;color:var(--g);text-shadow:0 0 30px #7a1a14,0 4px 0 #3a0f0b,0 0 60px #000}
h1 span,.fl span{display:inline-block;opacity:0;transform:translateY(40px) scale(1.5);filter:blur(8px);animation:ltr .9s forwards}
@keyframes ltr{to{opacity:1;transform:none;filter:none}}
.sub{position:relative;margin:18px 0 34px;font-style:italic;font-size:clamp(15px,3.2vw,30px);color:var(--t);text-shadow:0 2px 10px #000;opacity:0;animation:ltr 1.2s 2.2s forwards}
.btn{position:relative;background:linear-gradient(#9b1c14,#5a0f0b);color:var(--t);border:2px solid var(--g);padding:16px 34px;letter-spacing:.12em;font-size:clamp(14px,3.4vw,24px);box-shadow:0 0 30px #9b1c1499;transition:.3s;opacity:0;animation:ltr 1s 2.8s forwards}
.btn:hover{transform:scale(1.06);box-shadow:0 0 50px #d4a24a88}
#app{display:none;flex-direction:column;z-index:2;background:radial-gradient(#2a0d0a,#050302)}
.top,.bot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:var(--k);border:0 solid #d4a24a55;flex:none}
.top{border-bottom-width:1px}.bot{border-top-width:1px;justify-content:center;gap:14px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
.top b{flex:1;text-align:center;font-size:clamp(12px,2.2vw,24px);color:var(--g)}
.ib{background:#2a0d0a;color:var(--t);border:1px solid var(--g);padding:8px 13px;font-size:clamp(14px,1.6vw,22px);border-radius:4px;min-height:40px}
.ib:hover,.ib.on{background:#7a1a14}.ib[disabled]{opacity:.35;cursor:default}
#cnt{min-width:60px;text-align:center;font-size:clamp(16px,2vw,26px);color:var(--g)}
#dots{display:flex;gap:6px;padding:5px;justify-content:center;background:var(--k);flex:none}
#dots i{width:10px;height:10px;border-radius:50%;background:#4a2a1a;cursor:pointer;transition:.3s}
#dots i.a{background:var(--g);transform:scale(1.5)}
#prog{height:4px;background:linear-gradient(90deg,var(--r),var(--g));width:0;transition:width .6s;flex:none}
#stage{flex:1;overflow:auto;padding:8px;min-height:0;background:#262626}
.pg{height:100%;min-height:560px;display:grid;gap:8px;background:#fff;padding:8px;max-width:1800px;margin:0 auto;box-shadow:0 0 40px #000}
.fr{position:relative;overflow:hidden;border:3px solid #111;background:#fff;min-height:0;animation:pop .8s both;animation-delay:calc(var(--i)*.3s + .5s)}
@keyframes pop{from{opacity:0;transform:scale(.9) rotate(-1deg);filter:brightness(2.5)}}
.art{position:absolute;inset:0;overflow:hidden}
.art svg{width:100%;height:100%;display:block;transition:transform .25s ease-out;transform:scale(1.06)}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:10px;gap:6px;pointer-events:none}
.cap,.bb,.ov .btn{pointer-events:auto}
.cap,.bb{font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;font-style:italic;text-transform:uppercase;text-align:center;line-height:1.25}
.cap{align-self:flex-start;background:#fbeeb0;color:#222;border:2px solid #111;padding:7px 12px;font-size:clamp(10px,1.35vw,24px);font-weight:600;max-width:94%}
.bs{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.bb{position:relative;background:#fff;color:#1a1a1a;border:2px solid #222;border-radius:50%/45%;padding:12px 22px;font-weight:600;font-size:clamp(10px,1.35vw,24px);max-width:76%;cursor:pointer;animation:bp .5s both;animation-delay:calc(var(--i)*.3s + 1.2s);transition:transform .2s}
.bb:hover{transform:scale(1.04)}
@keyframes bp{from{opacity:0;transform:scale(.5)}}
.bb b{display:block;color:#8a1a12;font-size:.78em;letter-spacing:.05em}
.bb.l{align-self:flex-start;margin-bottom:8px}.bb.r{align-self:flex-end;margin-bottom:8px}
.bb::after{content:"";position:absolute;bottom:-10px;border:8px solid transparent;border-top:10px solid #222;border-bottom:0}
.bb.l::after{left:28px}.bb.r::after{right:28px}
.big{position:absolute;left:0;right:0;top:36%;text-align:center;font-size:clamp(22px,6vw,110px);letter-spacing:.06em;color:var(--t);text-shadow:0 0 25px var(--g),0 0 60px var(--r),0 3px 0 #000;animation:gl 3s ease-in-out infinite alternate}
@keyframes gl{from{filter:brightness(.8)}to{filter:brightness(1.4)}}
.rs{align-self:center;opacity:1;animation:none;font-size:clamp(12px,1.6vw,22px);padding:10px 20px}
.note{font-size:clamp(9px,1.1vw,16px);color:var(--t);text-align:center}
.q{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;background:linear-gradient(#1a0b08,#3a0f0b);color:var(--t);text-align:center}
.q h2{font-size:clamp(20px,3.4vw,52px);color:var(--g)}
.q p{font-size:clamp(16px,2.4vw,38px);max-width:900px}
.q .o{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.q .o button{font-size:clamp(14px,2vw,32px);padding:12px 22px;background:#2a0d0a;color:var(--t);border:2px solid var(--g);border-radius:6px;transition:.2s}
.q .o button:hover{background:#7a1a14}
.q .o button.ok{background:#1f7a3a;border-color:#7aff9a}.q .o button.no{background:#7a1a14;border-color:#f66;opacity:.6}
.fl{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none;text-align:center;font-size:clamp(30px,10vw,160px);color:var(--g);letter-spacing:.1em;text-shadow:0 0 40px var(--r),0 0 8px #000;opacity:0}
.fl.on{animation:fo 2.2s}
@keyframes fo{0%,85%{opacity:1}100%{opacity:0}}
#cu{position:fixed;inset:0;z-index:20;pointer-events:none}
#cu i{position:absolute;top:0;bottom:0;width:50.5%;background:linear-gradient(#0b0706,#4a120d);transition:transform .5s cubic-bezier(.7,0,.3,1)}
#cu i:first-child{left:0;transform:translateX(-101%);border-right:3px solid var(--g)}
#cu i:last-child{right:0;transform:translateX(101%);border-left:3px solid var(--g)}
#cu.go i{transform:none}
@media(max-width:700px){
 .pg{display:flex!important;flex-direction:column;height:auto;min-height:0;gap:14px;padding:6px}
 .fr{flex:none;animation-delay:calc(var(--i)*.12s)}
 .art{position:relative;inset:auto;aspect-ratio:4/3}
 .ov{position:static;padding:8px;gap:8px;background:#fff;pointer-events:auto}
 .cap{max-width:100%;align-self:stretch;font-size:13px}
 .bs{gap:8px;margin:0}
 .bb{max-width:100%;align-self:stretch!important;margin:0!important;font-size:13px;border-radius:18px;padding:8px 12px;animation:none}
 .bb::after{display:none}
 .big{top:30%;font-size:clamp(22px,8vw,40px)}
 .note{color:#333;font-size:11px}
 .top .ib span{display:none}
 #dots i{width:8px;height:8px}
 .q{min-height:70vh}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<section id="cover">
 <div class="bg" id="cbg"></div><div class="vig"></div>
 <div class="smoke" style="left:-10%"></div><div class="smoke" style="left:40%;animation-delay:-7s"></div>
 <h1 id="h1"></h1>
 <p class="sub">Нысанбай жыраудың тарихи дастаны</p>
 <button class="btn" id="start">КОМИКСТІ БАСТАУ</button>
</section>
<main id="app">
 <div class="top">
  <button class="ib" id="mus">♪ <span>Музыка</span></button>
  <button class="ib" id="ap">▶ <span>Авто</span></button>
  <b id="pt"></b>
  <button class="ib" id="fs">⛶</button>
  <button class="ib" id="rs1">↺</button>
 </div>
 <div id="prog"></div>
 <div id="stage"></div>
 <div id="dots"></div>
 <div class="bot">
  <button class="ib" id="pv">◀ Алдыңғы</button>
  <span id="cnt"></span>
  <button class="ib" id="nx">Келесі ▶</button>
 </div>
</main>
<div class="fl" id="fl"></div>
<div id="cu"><i></i><i></i></div>

<script>
let gid=0;
const O='stroke="#1a1410" stroke-width="1.8" stroke-linejoin="round"';
const W=b=>{const i='h'+gid++;return `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><defs><pattern id="${i}" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#000"/></pattern></defs>${b}<rect x="-200" y="-100" width="800" height="500" fill="url(#${i})" opacity=".05"/></svg>`};
const sky=(a,b)=>{const i='s'+gid++;return `<defs><linearGradient id="${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect x="-200" y="-100" width="800" height="500" fill="url(#${i})"/>`};
const sun=(x,y,r,c)=>`<circle cx="${x}" cy="${y}" r="${r*2.4}" fill="${c}" opacity=".25"/><circle cx="${x}" cy="${y}" r="${r*1.5}" fill="${c}" opacity=".35"/><circle cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
const hill=(y,c,a=20)=>`<path d="M-200 ${y}Q-50 ${y-a} 100 ${y}T400 ${y}T700 ${y}V400H-200Z" fill="${c}" ${O}/>`;
const cloud=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#fff" opacity=".94"><ellipse rx="34" ry="12"/><ellipse cx="-18" cy="-8" rx="20" ry="12"/><ellipse cx="14" cy="-12" rx="24" ry="14"/></g>`;
const DAY=()=>sky('#4f95d8','#d5ecf8')+cloud(70,48,1.3)+cloud(260,32,1)+cloud(345,85,.8);
const st=n=>{let s='';for(let i=0;i<n;i++)s+=`<circle cx="${(i*97+31)%520-60}" cy="${(i*53+11)%160}" r="${i%3?.8:1.6}" fill="#f3d58a" opacity=".9"/>`;return s};
const moon='<circle cx="330" cy="50" r="20" fill="#f3e3b0"/><circle cx="338" cy="45" r="18" fill="#2b3a67" opacity=".7"/>';
const orn=(y,c='#d4a24a')=>{let s='';for(let i=-5;i<12;i++)s+=`<path d="M${i*40} ${y}q10-12 20 0q10 12 20 0" fill="none" stroke="${c}" stroke-width="2"/><circle cx="${i*40+20}" cy="${y}" r="2.5" fill="${c}"/>`;return s};
const yurt=(x,y,s,c='#f0dcb0')=>`<g transform="translate(${x} ${y}) scale(${s})" ${O}><path d="M-34 0V-20Q0-54 34-20V0Z" fill="${c}"/><path d="M-34-20Q0-54 34-20" fill="none" stroke="#c0392b" stroke-width="4"/><path d="M-34-8H34" stroke="#c0392b" stroke-width="3"/><path d="M-8 0V-16Q0-22 8-16V0Z" fill="#3a1a10"/><circle cy="-43" r="5" fill="#3a2a1e"/></g>`;
const fort=(x,y,s=1)=>`<g transform="translate(${x} ${y}) scale(${s})" fill="#8a6a52" ${O}><rect x="-60" y="-30" width="120" height="30"/><rect x="-68" y="-54" width="24" height="54"/><rect x="44" y="-54" width="24" height="54"/><path d="M-70-54l14-16 14 16zM42-54l14-16 14 16z" fill="#5a3a2a"/><rect x="-6" y="-16" width="12" height="16" fill="#3a2a1e"/><path d="M0-30V-66" stroke="#222"/><path d="M0-66l20 5-20 7z" fill="#eee"/></g>`;
const fire=(x,y,s)=>`<g transform="translate(${x} ${y}) scale(${s})"><path d="M-60-30q8-38 15-8q6-34 15 0q8-32 17 2q8-34 17 4q8-30 16 2V-26Z" fill="#ff7a1a" ${O}/><path d="M-38-28q4-20 9-4q4-18 9 0q4-16 9 2z" fill="#ffd23a"/></g>`;
const smoke=(x,y)=>`<circle cx="${x}" cy="${y}" r="30" fill="#555" opacity=".45"/><circle cx="${x+25}" cy="${y-30}" r="26" fill="#555" opacity=".38"/><circle cx="${x+10}" cy="${y-62}" r="24" fill="#555" opacity=".3"/>`;
const inter=()=>'<rect x="-200" y="-100" width="800" height="500" fill="#e6cc98"/>'+orn(40,'#cfae72')+orn(95,'#cfae72')+orn(150,'#cfae72')+orn(205,'#cfae72')+'<rect x="-200" y="252" width="800" height="60" fill="#c99a5a"/><path d="M-200 252H600" stroke="#1a1410" stroke-width="2"/>';
const face=(x,y,s,o)=>{const sk=o.skin||'#d9a070',hr='#1a0e0a',br=o.mad?'M-19 -2L-4 -8M19 -2L4 -8':'M-18 -6Q-10 -10-3 -6M18 -6Q10 -10 3 -6';
return `<g transform="translate(${x} ${y}) scale(${s})" ${O}><path d="M-68 190Q-66 52-24 40L24 40Q66 52 68 190Z" fill="${o.robe}"/><path d="M-44 90Q0 118 44 90M-60 140Q0 168 60 140" fill="none" stroke="#e6b64a" stroke-width="2.5"/><path d="M-17 40L0 98L17 40" fill="#00000030" stroke="#e6b64a" stroke-width="5"/><rect x="-11" y="16" width="22" height="30" fill="#b9854e"/><ellipse cx="-25" cy="6" rx="4" ry="7" fill="${sk}"/><ellipse cx="25" cy="6" rx="4" ry="7" fill="${sk}"/><path d="M-24-8Q-26 36 0 46Q26 36 24-8Q22-28 0-28Q-22-28-24-8Z" fill="${sk}"/><path d="M-16 1Q-10-3-4 1Q-10 5-16 1ZM16 1Q10-3 4 1Q10 5 16 1Z" fill="#fff" stroke-width="1.2"/><circle cx="-10" cy="1" r="2.3" fill="#000" stroke="none"/><circle cx="10" cy="1" r="2.3" fill="#000" stroke="none"/><path d="${br}" fill="none" stroke="${hr}" stroke-width="3.2" stroke-linecap="round"/><path d="M0 4L-3 16Q0 19 4 16" fill="none" stroke-width="1.4"/>${o.beard?`<path d="M-24 12Q-27 54 0 62Q27 54 24 12Q18 34 0 34Q-18 34-24 12Z" fill="${hr}"/>`:''}<path d="M-14 25Q-7 19 0 23Q7 19 14 25Q7 29 0 26Q-7 29-14 25Z" fill="${hr}" stroke-width="1"/><path d="M-5 33Q0 35 5 33" fill="none" stroke="#9a5a4a" stroke-width="1.6"/>${o.hat}</g>`};
const cap=(c,f='#3a2a1e')=>`<path d="M-28-12Q-33-52 0-56Q33-52 28-12Q0-22-28-12Z" fill="${c}"/><path d="M-30-14Q0-26 30-14L29-2Q0-13-29-2Z" fill="${f}"/>`;
const HK=cap('#d8392b')+'<circle cy="-34" r="3" fill="#e6b64a" stroke-width="1"/>';
const HN='<path d="M-26-10Q-28-50 0-54Q28-50 26-10Q0-20-26-10Z" fill="#b8c2c8"/><path d="M-27-12Q0-22 27-12L26-4Q0-14-26-4Z" fill="#e6b64a"/><path d="M-2-54L0-76L2-54Z" fill="#e6b64a"/>';
const HW='<path d="M-26-12Q-30-52 0-58Q30-52 26-12Q0-22-26-12Z" fill="#f6f3ea"/><path d="M-28-14Q0-24 28-14L27-4Q0-14-27-4Z" fill="#222"/>';
const HT=cap('#2f8f94'),HB=cap('#7a6a44');
const HS='<path d="M-32-10Q-34-56 0-58Q34-56 32-10L33 52Q0 38-33 52ZM-22-10Q-24 36 0 44Q24 36 22-10Q22-24 0-26Q-22-24-22-10Z" fill="#f6f3ea" fill-rule="evenodd"/>';
const horse=c=>`<path d="M-34-4Q-34-18-14-18L14-18Q26-22 32-34L42-42L52-38L52-30L42-24Q36-10 30 8L28 30L22 30L24 10L8 8L-2 28L-8 28L-8 6L-24 6L-32 28L-38 28L-32 4Z" fill="${c}"/><path d="M-34-10Q-54-8-56 18Q-44 6-34 2Z" fill="${c}"/>`;
const rider=(x,y,s,c='#d8392b',f=0,hc='#7a4a2a')=>`<g transform="translate(${x} ${y}) scale(${s})" ${O}>${horse(hc)}<path d="M-12-18L-8-44L6-44L10-18Z" fill="${c}"/><circle cx="-1" cy="-52" r="7" fill="#d9a070"/><path d="M-9-54Q-1-66 8-54Z" fill="#d8392b"/>${f?'<path d="M10-40L26-84" stroke="#e6b64a" stroke-width="2.4"/><path d="M26-84l24 6-20 13z" fill="#d8392b"/>':'<path d="M10-40L36-72" stroke="#e6b64a" stroke-width="2"/>'}</g>`;
const dombra=(x,y,r)=>`<g transform="translate(${x} ${y}) rotate(${r})" ${O}><rect x="12" y="-3" width="100" height="6" fill="#5a2a10"/><ellipse rx="28" ry="19" fill="#c0813a"/><circle r="6" fill="#3a1a10"/></g>`;
const SC={
 cover:()=>sky('#1a0504','#e08a3a')+sun(200,175,36,'#f6cf63')+'<path d="M-100 210L40 120L120 190L200 100L290 195L360 130L500 210V400H-100Z" fill="#5a1710" '+O+'/>'+hill(228,'#2a0d0a',14)+face(-10,170,1.3,{robe:'#d8392b',hat:HK,beard:1,mad:1})+face(410,185,1.2,{robe:'#2f8f94',hat:HN,mad:1})+hill(262,'#0b0706',8)+rider(170,266,1.8,'#d8392b',1,'#2a140c')+rider(250,276,1.4,'#b3261e',1,'#2a140c')+rider(110,278,1.1,'#b3261e',0,'#1a0b08')+rider(310,284,1,'#b3261e',0,'#1a0b08'),
 dawn:()=>sky('#f08a4b','#fde2a0')+sun(285,170,22,'#fff3b0')+hill(200,'#7da23a',16)+hill(232,'#5f8a2a',12)+yurt(70,244,.9)+yurt(115,252,.7)+rider(190,250,1.2,'#d8392b',1)+rider(250,258,1,'#2f8f94'),
 fort:()=>DAY()+hill(212,'#7da23a',10)+smoke(270,150)+fort(270,222,1.3)+yurt(60,250,1)+yurt(120,262,.7)+hill(270,'#5f8a2a',6),
 zh:()=>sky('#2b3a67','#e8a060')+st(30)+moon+hill(238,'#3a4a2a',10)+yurt(60,252,1,'#d9c090')+face(185,100,1.2,{robe:'#555',hat:HW,beard:1})+dombra(235,225,-42),
 mourn:()=>sky('#6a3a3a','#e9a56a')+sun(60,140,18,'#f3c070')+hill(236,'#3a4a2a',10)+face(195,100,1.2,{robe:'#555',hat:HW,beard:1})+dombra(235,225,-42),
 k:()=>inter()+'<path d="M80 300V110" stroke="#5a3a1e" stroke-width="3"/><path d="M80 110l50 14-50 20z" fill="#d8392b" '+O+'/>'+face(200,100,1.25,{robe:'#d8392b',hat:HK,beard:1,mad:1}),
 n:()=>inter()+face(200,100,1.25,{robe:'#2f8f94',hat:HN,mad:1}),
 ride:()=>DAY()+hill(196,'#7da23a',14)+hill(230,'#5f8a2a',12)+rider(165,248,1.4,'#d8392b',1)+rider(240,256,1.4,'#2f8f94',1)+rider(305,246,1.1,'#7a6a44')+rider(95,258,.9,'#b3261e'),
 council:()=>inter()+face(95,118,.85,{robe:'#4a6a8a',hat:HT,beard:1})+face(305,118,.85,{robe:'#6a5a3a',hat:HB,beard:1})+face(200,108,1,{robe:'#d8392b',hat:HK,beard:1,mad:1}),
 attack:()=>sky('#6a8cb8','#e8c090')+smoke(210,130)+hill(228,'#5f8a2a',8)+fort(210,236,1.4)+fire(210,236,1.4)+rider(80,264,1.2,'#d8392b',1)+rider(330,268,1,'#2f8f94'),

let ac,mg,on=false,sf=false;
function initAudio(){
 if(ac)return;
 ac=new(window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=0;mg.connect(ac.destination);const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.28;fb.gain.value=.35;wet.gain.value=.4;mg.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);
 [73.4,110].forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.07;o.connect(g);g.connect(mg);o.start()});
 const pluck=(f,v=.5)=>{const sr=ac.sampleRate,n=Math.floor(sr*1.8),b=ac.createBuffer(1,n,sr),d=b.getChannelData(0),p=Math.round(sr/f);for(let i=0;i<p;i++)d[i]=(Math.random()*2-1)*v;for(let i=p;i<n;i++)d[i]=(d[i-p]+d[i-p+1])/2*.996;const s=ac.createBufferSource();s.buffer=b;s.connect(mg);s.start()};const mel=[293.7,0,440,392,349.2,392,293.7,0,293.7,349.2,392,440,523.3,440,392,0];let k=0;
 setInterval(()=>{if(!on)return;const i=k++%mel.length;if(mel[i])pluck(mel[i]);if(i%8==0)pluck(146.8,.6)},300);
}
function sfx(f0,f1,d,v=.4,type='sine'){
 if(!ac||!sf)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
 o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d+.05);
}
const drum=()=>{sfx(130,50,.5,.3);setTimeout(()=>sfx(110,45,.4,.2),240)};

let cur=0,busy=false,score=0;
function quiz(p){
 let i=0;score=0;const el=document.createElement('div');el.className='q';
 const draw=()=>{
  if(i>=p.quiz.length){
   const r=score==p.quiz.length?'Тамаша! Сен нағыз тарихшысың!':score>=2?'Жақсы! Тағы бір қайталап көр.':'Комиксті қайта оқып шық!';
   el.innerHTML=`<h2>Нәтиже: ${score} / ${p.quiz.length}</h2><p>${r}</p><button class="btn rs" style="opacity:1;animation:none">↺ ҚАЙТА БАСТАУ</button>`;
   el.querySelector('button').onclick=()=>show(0);if(score==p.quiz.length)drum();return}
  const [q,o,a]=p.quiz[i];
  el.innerHTML=`<h2>Сұрақ ${i+1} / ${p.quiz.length}</h2><p>${q}</p><div class="o">${o.map((x,j)=>`<button data-j="${j}">${x}</button>`).join('')}</div>`;
  el.querySelectorAll('.o button').forEach(b=>b.onclick=()=>{
   const j=+b.dataset.j;el.querySelectorAll('.o button').forEach(x=>x.disabled=true);
   el.querySelectorAll('.o button')[a].classList.add('ok');
   if(j==a){score++;sfx(660,990,.3,.12)}else{b.classList.add('no');sfx(220,130,.35,.12)}
   setTimeout(()=>{i++;draw()},1300)});
 };
 draw();return el;
}
function render(n){

 $('pt').textContent=(n+1)+'-бет · '+p.t;$('cnt').textContent=(n+1)+'/'+P.length;

 document.querySelectorAll('#dots i').forEach((d,i)=>d.classList.toggle('a',i==n));
 if(p.quiz){g.innerHTML='<div class="pg" style="display:block;padding:0"></div>';g.firstChild.appendChild(quiz(p));g.firstChild.firstChild.style.minHeight='100%';return}
 const rw=p.a.split("' '"),cols=rw[0].replace(/'/g,'').split(' ').length;
 let h=`<div class="pg" style="grid-template-areas:${p.a};grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rw.length},1fr)">`;

}

const cv=$('fx'),cx=cv.getContext('2d');const E=[];
function rz(){cv.width=innerWidth;cv.height=innerHeight}rz();addEventListener('resize',rz);
for(let i=0;i<60;i++)E.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*2+.5,v:Math.random()*.8+.3,d:Math.random()*6});
(function tick(){
 cx.clearRect(0,0,cv.width,cv.height);
 E.forEach(e=>{e.y-=e.v;e.x+=Math.sin(e.y/40+e.d)*.5;if(e.y<-5){e.y=cv.height+5;e.x=Math.random()*cv.width}
  cx.beginPath();cx.arc(e.x,e.y,e.r,0,7);cx.fillStyle=`rgba(255,${150+e.r*30|0},60,${.3+e.r/7})`;cx.fill()});
 requestAnimationFrame(tick)})();

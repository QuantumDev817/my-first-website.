<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой личный квест</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: radial-gradient(circle at top right, #1a103c 0%, #050505 60%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .screen {
            width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            padding: 20px; z-index: 10;
        }
        .card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 50px 40px; border-radius: 24px;
            text-align: center; max-width: 450px; width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.2rem; font-weight: 700;
            margin-bottom: 40px; line-height: 1.2;
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .buttons { display: flex; gap: 15px; justify-content: center; position: relative; height: 60px; }
        .btn {
            padding: 16px 32px; font-size: 16px; font-weight: 600;
            font-family: 'Inter', sans-serif; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; border: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; box-shadow: 0 10px 20px -10px rgba(118, 75, 162, 0.5);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -10px rgba(118, 75, 162, 0.8); }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.05); color: #a0a0a0;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); color: white; }
        #btn-no { position: relative; transition: 0.2s; }
        .compliments { display: flex; flex-direction: column; gap: 15px; }
        .compliments p { font-size: 1.2rem; font-weight: 600; opacity: 0; transform: translateY(20px); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .c1 { animation-delay: 0.2s; color: #00f2fe; }
        .c2 { animation-delay: 0.8s; color: #ff0844; }
        .c3 { animation-delay: 1.4s; color: #00ff87; }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
        .falling-rose { position: absolute; top: -50px; font-size: 24px; pointer-events: none; z-index: 100; animation: fallRose linear forwards; }
        @keyframes fallRose { to { transform: translateY(110vh) rotate(360deg); } }
    </style>
</head>
<body>

    <div id="screen1" class="screen">
        <div class="card">
            <h1 class="title">Ты красивая?</h1>
            <div class="buttons">
                <button id="btn-yes" class="btn btn-primary">Да</button>
                <button id="btn-no" class="btn btn-secondary">Нет</button>
            </div>
        </div>
    </div>

    <div id="screen2" class="screen" style="display: none;">
        <div class="card">
            <h1 class="title">Вопрос 2:<br>Ты самая лучшая?</h1>
            <button id="btn-next" class="btn btn-primary">Конечно да!</button>
        </div>
    </div>

    <div id="screen3" class="screen" style="display: none;">
        <div class="card">
            <h1 class="title">Сюрприз 🎉</h1>
            <div class="compliments">
                <p class="c1">Ты самая лучшая ✨</p>
                <p class="c2">Ты чертовски красивая 🌹</p>
                <p class="c3">С тобой пиздец как круто 🔥</p>
            </div>
            <button id="btn-restart" class="btn btn-primary" style="margin-top: 30px; background: transparent; border: 1px solid rgba(255,255,255,0.3);">Пройти заново</button>
        </div>
    </div>

    <script>
        // Весь JS код прямо здесь, чтобы он точно загрузился
        const btnYes = document.getElementById('btn-yes');
        const btnNo = document.getElementById('btn-no');
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const btnNext = document.getElementById('btn-next');
        const btnRestart = document.getElementById('btn-restart');
        const screen3 = document.getElementById('screen3');

        let clickCount = 0; 

        btnNo.addEventListener('mouseover', () => {
            const maxX = window.innerWidth - btnNo.offsetWidth - 20; 
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            const randomX = Math.floor(Math.random() * maxX);
            const randomY = Math.floor(Math.random() * maxY);
            btnNo.style.position = 'fixed'; 
            btnNo.style.left = randomX + 'px';
            btnNo.style.top = randomY + 'px';
            clickCount++;
            btnYes.style.transform = `scale(${1 + clickCount * 0.1})`; 
        });

        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            btnNo.style.position = 'fixed';
            btnNo.style.left = Math.floor(Math.random() * maxX) + 'px';
            btnNo.style.top = Math.floor(Math.random() * maxY) + 'px';
            clickCount++;
            btnYes.style.transform = `scale(${1 + clickCount * 0.1})`; 
        });

        btnYes.addEventListener('click', () => {
            screen1.style.display = 'none'; 
            screen2.style.display = 'flex'; 
        });

        btnNext.addEventListener('click', () => {
            screen2.style.display = 'none';
            screen3.style.display = 'flex';
            startRoseRain();
        });

        function startRoseRain() {
            const roses = ['🌹', '🌺', '🌸', '✨', '💖']; 
            const roseInterval = setInterval(() => {
                const rose = document.createElement('div');
                rose.classList.add('falling-rose');
                rose.innerText = roses[Math.floor(Math.random() * roses.length)];
                rose.style.left = Math.random() * 100 + 'vw';
                const duration = Math.random() * 2 + 2; 
                rose.style.animationDuration = duration + 's';
                document.body.appendChild(rose);
                setTimeout(() => { rose.remove(); }, duration * 1000);
            }, 150);
            setTimeout(() => clearInterval(roseInterval), 10000);
        }

        btnRestart.addEventListener('click', () => {
            screen3.style.display = 'none';
            screen1.style.display = 'flex';
            clickCount = 0;
            btnYes.style.transform = 'scale(1)'; 
            btnNo.style.position = 'relative'; 
            btnNo.style.left = '0px';
            btnNo.style.top = '0px';
        });
    </script>
</body>
</html>

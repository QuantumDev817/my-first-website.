<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Солнечная Вспышка</title>
    <style>
        /* --- БАЗА И КОСМОС --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #020005;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            position: relative;
        }

        /* Звездный фон (просто мелкие точки) */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: 1;
        }

        /* --- САМО СОЛНЦЕ --- */
        .sun-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 400px;
            width: 400px;
        }

        .sun {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle at 30% 30%, #fff700, #ff9900 50%, #ff3300);
            border-radius: 50%;
            box-shadow: 0 0 50px #ff9900, 0 0 100px #ff3300, 0 0 200px #ff0000;
            transition: all 0.3s ease;
            position: relative;
            z-index: 10;
        }

        /* Ебаная анимация "джижения" (пульсации) */
        .sun.djijitsya {
            animation: pulse 0.1s infinite alternate;
            box-shadow: 0 0 100px #ffffff, 0 0 200px #ff9900, 0 0 300px #ff0000;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Вспышка при клике */
        .sun.explode {
            animation: explodeAnim 1.5s ease-out;
        }

        @keyframes explodeAnim {
            0% { transform: scale(1); filter: brightness(1); }
            20% { transform: scale(2); filter: brightness(3); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* --- ЧАСТИЦЫ (Вспышка) --- */
        .particle {
            position: absolute;
            background-color: #ffcc00;
            border-radius: 50%;
            pointer-events: none;
            z-index: 5;
        }

        /* --- КНОПКА --- */
        .btn {
            margin-top: 50px;
            padding: 15px 40px;
            background: transparent;
            color: #ff9900;
            border: 2px solid #ff9900;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            z-index: 20;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(255, 153, 0, 0.2);
        }

        .btn:hover {
            background: #ff9900;
            color: #000;
            box-shadow: 0 0 30px rgba(255, 153, 0, 0.8);
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="sun-container" id="sun-container">
        <div class="sun" id="sun"></div>
    </div>

    <button class="btn" id="boom-btn">ВЗОРВАТЬ СОЛНЦЕ</button>

    <script>
        const sun = document.getElementById('sun');
        const btn = document.getElementById('boom-btn');
        const container = document.getElementById('sun-container');

        btn.addEventListener('click', () => {
            // 1. Запускаем анимацию взрыва
            sun.classList.add('explode');
            
            // 2. Создаем ебаную кучу частиц
            createParticles();

            // 3. Убираем анимацию через 1.5 секунды, чтобы можно было нажать снова
            setTimeout(() => {
                sun.classList.remove('explode');
            }, 1500);
        });

        function createParticles() {
            const numParticles = 100; // Количество частиц

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Случайный размер
                const size = Math.random() * 10 + 5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';

                // Ставим частицу в центр (где солнце)
                particle.style.left = '50%';
                particle.style.top = '50%';

                // Случайный цвет (от желтого до красного)
                const colors = ['#fff700', '#ff9900', '#ff3300', '#ffffff'];
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];

                container.appendChild(particle);

                // Ебаная математика для разлета частиц в разные стороны
                const angle = Math.random() * Math.PI * 2; // Случайный угол
                const distance = Math.random() * 200 + 50; // Случайная дистанция
                const x = Math.cos(angle) * distance;
                const y = Math.sin(angle) * distance;

                // Анимируем через JS (можно и через CSS, но так быстрее прописать динамику)
                particle.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: Math.random() * 1000 + 500, // от 0.5 до 1.5 секунд
                    easing: 'ease-out'
                });

                // Удаляем частицу, когда она отлетела
                setTimeout(() => {
                    particle.remove();
                }, 1500);
            }
        }
    </script>
</body>
</html>

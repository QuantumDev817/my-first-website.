<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <!-- Красивые шрифты: один для заголовков (рукописный), другой для текста -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Нежный градиент: глубокий фиолетовый переходит в бархатный черный */
            background: radial-gradient(circle at center, #2b0b3f 0%, #0a000f 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- ЭКРАН 1: ВХОД --- */
        #intro-screen {
            text-align: center;
            z-index: 10;
            transition: opacity 1s ease;
        }

        .intro-title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #ffb3c6;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 179, 198, 0.5);
        }

        .btn-love {
            padding: 15px 40px;
            background: transparent;
            border: 2px solid #ffb3c6;
            color: #ffb3c6;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 179, 198, 0.2);
            font-family: 'Poppins', sans-serif;
        }

        .btn-love:hover {
            background: #ffb3c6;
            color: #0a000f;
            box-shadow: 0 0 30px rgba(255, 179, 198, 0.8);
            transform: scale(1.05);
        }

        /* --- ЭКРАН 2: САМ САЙТ --- */
        #main-screen {
            display: none;
            opacity: 0;
            text-align: center;
            max-width: 600px;
            padding: 40px;
            z-index: 10;
            transition: opacity 1.5s ease;
        }

        /* Стеклянная карточка */
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 179, 198, 0.2);
            padding: 50px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .main-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #ffb3c6;
            margin-bottom: 20px;
        }

        /* Текст с печатной машинкой */
        .typewriter-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            min-height: 120px; /* Чтобы текст не прыгал, пока печатается */
        }

        .heart-icon {
            font-size: 3rem;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
            display: inline-block;
        }

        /* Анимация пульсации сердечка в конце */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 15px #ffb3c6); }
            100% { transform: scale(1); }
        }

        /* --- ПАДАЮЩИЕ СЕРДЕЧКИ (ФОН) --- */
        .falling-heart {
            position: absolute;
            top: -50px;
            color: #ffb3c6;
            font-size: 20px;
            opacity: 0.6;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <!-- Экран 1 -->
    <div id="intro-screen">
        <h1 class="intro-title">У меня кое-что для тебя...</h1>
        <button class="btn-love" onclick="openLove()">Нажми сюда</button>
    </div>

    <!-- Экран 2 -->
    <div id="main-screen">
        <div class="glass-card">
            <h2 class="main-title" id="girl-name">Привет, [Имя]</h1>
            <p class="typewriter-text" id="typewriter"></p>
            <div class="heart-icon">❤️</div>
        </div>
    </div>

    <script>
        // --- 1. ЛОГИКА ОТКРЫТИЯ ---
        function openLove() {
            const intro = document.getElementById('intro-screen');
            const main = document.getElementById('main-screen');
            
            intro.style.opacity = '0';
            setTimeout(() => {
                intro.style.display = 'none';
                main.style.display = 'block';
                setTimeout(() => {
                    main.style.opacity = '1';
                    startTyping(); // Запускаем печать текста
                }, 100);
            }, 1000);
        }

        // --- 2. ЭФФЕКТ ПЕЧАТНОЙ МАШИНКИ ---
        // ЗДЕСЬ ТВОЙ ТЕКСТ. Можешь поменять его на что угодно!
        const textToType = "Я тут немного залип в код и понял, что даже самые сложные алгоритмы не сравнятся с тобой. Ты — мой любимый баг, который я никогда не захочу исправлять. Спасибо, что ты есть. ✨";
        
        let i = 0;
        function startTyping() {
            const elem = document.getElementById('typewriter');
            elem.innerHTML = ""; // Очищаем перед началом
            
            function type() {
                if (i < textToType.length) {
                    elem.innerHTML += textToType.charAt(i);
                    i++;
                    setTimeout(type, 40); // Скорость печати (40 мс)
                }
            }
            type();
        }

        // --- 3. ПАДАЮЩИЕ СЕРДЕЧКИ ---
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('falling-heart');
            heart.innerText = "❤";
            
            // Случайная позиция по ширине
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Случайная скорость падения (от 3 до 7 секунд)
            const duration = Math.random() * 4 + 3;
            heart.style.animationDuration = duration + 's';
            
            // Случайный размер
            heart.style.fontSize = (Math.random() * 20 + 10) + 'px';

            document.body.appendChild(heart);

            // Удаляем сердечко после падения
            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        // Запускаем сердечки каждые 300 миллисекунд
        setInterval(createHeart, 300);
    </script>
</body>
</html>

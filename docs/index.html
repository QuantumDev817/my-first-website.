<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Твой личный квест</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ЭКРАН 1: Вопрос 1 -->
    <div id="screen1" class="screen">
        <h1 class="glow-text">Ты красивая?</h1>
        <div class="buttons">
            <button id="btn-yes" class="btn">Да</button>
            <button id="btn-no" class="btn">Нет</button>
        </div>
    </div>

    <!-- ЭКРАН 2: Вопрос 2 -->
    <div id="screen2" class="screen" style="display: none;">
        <h1 class="glow-text">Вопрос 2: Ты самая лучшая?</h1>
        <button id="btn-next" class="btn">Конечно да!</button>
    </div>

    <!-- ЭКРАН 3: Сюрприз -->
    <div id="screen3" class="screen" style="display: none;">
        <h1 class="surprise-title">Сюрприз! 🎉</h1>
        
        <div class="compliments-container">
            <p class="compliment c1">Ты самая лучшая! ✨</p>
            <p class="compliment c2">Ты чертовски красивая! 🌹</p>
            <p class="compliment c3">С тобой пиздец как круто! 🔥</p>
        </div>
        
        <button id="btn-restart" class="btn restart-btn">Пройти заново</button>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K1ant | CYBER-OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #020202;
            color: #00ffff;
            font-family: 'Share Tech Mono', monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* --- МАТРИЧНЫЙ ФОН --- */
        canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        /* --- 3D ГОЛОГРАММА --- */
        .hud-container {
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            z-index: 10;
        }

        .card {
            background: rgba(0, 20, 20, 0.6);
            border: 2px solid #00ffff;
            border-radius: 15px;
            padding: 40px;
            width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2), inset 0 0 20px rgba(0, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        /* Ебаные декоративные линии по углам */
        .card::before, .card::after {
            content: ''; position: absolute; width: 50px; height: 50px;
        }
        .card::before {
            top: -2px; left: -2px;
            border-top: 4px solid #ff00ff;
            border-left: 4px solid #ff00ff;
        }
        .card::after {
            bottom: -2px; right: -2px;
            border-bottom: 4px solid #ff00ff;
            border-right: 4px solid #ff00ff;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff;
            transform: translateZ(50px); /* Выпуклость */
        }

        .subtitle {
            color: #ff00ff;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 0 10px #ff00ff;
            transform: translateZ(40px);
        }

        .terminal-text {
            text-align: left;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #00ff41;
            min-height: 100px;
            margin-bottom: 30px;
            border-left: 2px solid #00ff41;
            padding-left: 10px;
            transform: translateZ(30px);
        }

        /* КНОПКА */
        .btn {
            background: transparent;
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 15px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            transform: translateZ(60px);
        }

        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 30px #00ffff;
        }

        /* --- ЭФФЕКТ ГЛИТЧА --- */
        .glitch {
            animation: glitchAnim 0.3s linear infinite;
        }

        @keyframes glitchAnim {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px); filter: hue-rotate(90deg); }
            40% { transform: translate(-5px, -5px); }
            60% { transform: translate(5px, 5px); filter: hue-rotate(-90deg); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        /* Частицы при взломе */
        .particle {
            position: absolute;
            color: #00ffff;
            font-family: 'Share Tech Mono', monospace;
            font-weight: bold;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div class="hud-container" id="hud">
        <div class="card">
            <h1 class="title">K1ant OS</h1>
            <div class="subtitle">System Version 1.0.8</div>
            
            <div class="terminal-text" id="terminal">
                > Инициализация ядра...<br>
                > Проверка безопасности...<br>
                > Статус: СТАБИЛЕН.<br>
                > Ожидание команды...
            </div>

            <button class="btn" id="hackBtn">Взломать систему</button>
        </div>
    </div>

    <script>
        // --- 1. 3D НАКЛОН ЗА КУРСОРОМ ---
        const hud = document.getElementById('hud');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            hud.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // --- 2. МАТРИЧНЫЙ ДОЖДЬ НА CANVAS ---
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const letters = "01010101ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = [];
        for (let x = 0; x < columns; x++) drops[x] = 1;

        function drawMatrix() {
            ctx.fillStyle = "rgba(2, 2, 2, 0.05)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffff"; // Цвет букв
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = letters.charAt(Math.floor(Math.random() * letters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // --- 3. ЛОГИКА ВЗЛОМА ---
        const btn = document.getElementById('hackBtn');
        const terminal = document.getElementById('terminal');
        let isHacked = false;

        btn.addEventListener('click', () => {
            if (isHacked) return;
            isHacked = true;
            
            // Запускаем ебаный глитч
            document.body.classList.add('glitch');
            terminal.innerHTML = "> ВЗЛОМ...<br>> ДОСТУП РАЗРЕШЕН.<br>> ПРИВЕТ, СЫНОК. ТЫ КРУТ.";
            
            // Создаем ебаный взрыв из кода
            createExplosion();

            setTimeout(() => {
                document.body.classList.remove('glitch');
                isHacked = false;
            }, 2000);
        });

        function createExplosion() {
            const chars = ['0', '1', 'X', '!', '?', '>', '<', 'K1ant'];
            for (let i = 0; i < 150; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                p.innerText = chars[Math.floor(Math.random() * chars.length)];
                
                // Ставим в центр экрана
                p.style.left = '50%';
                p.style.top = '50%';
                
                // Случайный цвет
                p.style.color = Math.random() > 0.5 ? '#ff00ff' : '#00ffff';
                p.style.fontSize = (Math.random() * 20 + 10) + 'px';
                
                document.body.appendChild(p);

                // Разлетаемся нахуй
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 600 + 100;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                p.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(0)`, opacity: 0 }
                ], {
                    duration: 1500,
                    easing: 'cubic-bezier(0, .9, .57, 1)'
                });

                setTimeout(() => p.remove(), 1500);
            }
        }
    </script>
</body>
</html>

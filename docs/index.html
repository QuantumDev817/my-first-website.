<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фан-сайт Амины</title>
    <style>
        /* --- БАЗА И ТЕМНАЯ ТЕМА --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #111; /* Темный фон как в FNAF */
            color: white;
            font-family: 'Courier New', Courier, monospace; /* Шрифт как в хоррорах */
            overflow: hidden; /* Чтобы не было скролла от падающих смайлов */
        }

        /* --- ЭКРАН 1: ПРИВЕТСТВИЕ --- */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            z-index: 10;
            position: relative;
        }

        h1 { text-shadow: 0 0 10px red; }
        
        button {
            padding: 15px 30px;
            font-size: 20px;
            background-color: transparent;
            color: #ff4444;
            border: 2px solid #ff4444;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            box-shadow: 0 0 10px #ff4444;
        }

        button:hover {
            background-color: #ff4444;
            color: black;
            box-shadow: 0 0 20px #ff4444;
        }

        /* --- ЭКРАН 2: FNAF КАСКАД (Скрыт по умолчанию) --- */
        #fnaf-screen {
            display: none; /* Спрятан */
            height: 100vh;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .fnaf-stack {
            position: relative;
            width: 300px;
            height: 400px;
            margin-top: 50px;
        }

        .photo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 3px solid #333;
            opacity: 0; /* Изначально невидимы */
            /* Анимация появления */
            animation: jumpScare 0.4s forwards;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8);
        }

        /* Задержки для каждой фотки (сначала 1, потом 2 и т.д.) */
        .p1 { animation-delay: 0.5s; z-index: 1; top: 0px; left; 0px; }
        .p2 { animation-delay: 1.2s; z-index: 2; top: 20px; left: 20px; }
        .p3 { animation-delay: 1.9s; z-index: 2; top: 40px; left: 40px; }
        .p4 { animation-delay: 2.6s; z-index: 1; top: 600px; left:600px; }

        /* Эффект резкого появления (как скример в FNAF) */
        @keyframes jumpScare {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            80% { opacity: 1; transform: scale(1.05) rotate(2deg); }
            100% { opacity: 1; transform: scale(1) rotate(0); }
        }

        /* --- ПАДАЮЩИЕ СМАЙЛИКИ --- */
        .falling-emoji {
            position: absolute;
            top: -50px;
            font-size: 30px;
            pointer-events: none; /* Чтобы не мешали кликать */
            animation: fall linear forwards;
            z-index: 1;
        }

        @keyframes fall {
            to { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1 -->
    <div id="welcome-screen">
        <h1>ЗАХОДИТЕ, ФАНАТЫ АМИНЫ</h1>
        <p>Осторожно... то, что внутри, может напугать.</p>
        <button id="openBtn">ОТКРЫТЬ СЕКРЕТ</button>
    </div>

    <!-- ЭКРАН 2 (FNAF) -->
    <div id="fnaf-screen">
        <div class="fnaf-stack">
            <img src="fnaf1.jpg" class="photo p1" alt="Фото 1">
            <img src="fnaf2.jpg" class="photo p2" alt="Фото 2">
            <img src="fnaf3.jpg" class="photo p3" alt="Фото 3">
            <img src="fnaf.jpg" class="photo p4" alt="Фото 4">
        </div>
    </div>

    <!-- СКРИПТЫ -->
    <script>
        // 1. ЛОГИКА КНОПКИ
        const openBtn = document.getElementById('openBtn');
        const welcomeScreen = document.getElementById('welcome-screen');
        const fnafScreen = document.getElementById('fnaf-screen');

        openBtn.addEventListener('click', () => {
            welcomeScreen.style.display = 'none'; // Прячем первый экран
            fnafScreen.style.display = 'flex'; // Показываем экран с фотками
        });

        // 2. ЛОГИКА ПАДАЮЩИХ СМАЙЛИКОВ
        const emojis = ['😈', '💀', '👻', '🖤', '🎃', '👁️']; // Можешь добавить свои

        function createEmoji() {
            const emoji = document.createElement('div');
            emoji.classList.add('falling-emoji');
            
            // Выбираем случайный смайлик
            emoji.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            
            // Случайная позиция по горизонтали
            emoji.style.left = Math.random() * 100 + 'vw';
            
            // Случайная скорость падения (от 2 до 5 секунд)
            const fallDuration = Math.random() * 3 + 2;
            emoji.style.animationDuration = fallDuration + 's';
            
            // Случайный размер
            emoji.style.fontSize = (Math.random() * 20 + 20) + 'px';

            document.body.appendChild(emoji);

            // Удаляем смайлик, когда он упадет, чтобы не грузить браузер
            setTimeout(() => {
                emoji.remove();
            }, fallDuration * 1000);
        }

        // Запускаем создание смайликов каждые 300 миллисекунд
        setInterval(createEmoji, 300);
    </script>

</body>
</html>
